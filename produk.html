    /* Reset dan box-sizing */
    *, *::before, *::after {

    }body {
  font-family: Arial, sans-serif;
  background: #f8f8f8;
  padding: 20px;

}

.produk {
  display: flex;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  padding: 12px;
  margin-bottom: 15px;
  align-items: center;
  text-decoration: none;
  color: inherit;
  min-height: 110px;
  transition: background-color 0.2s;
}
.produk:hover {
  background-color: #f0f0f0;
}

.produk img {
  flex-shrink: 0;
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 6px;
  margin-right: 15px;
}

.info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 100%;
}

.judul {
  font-weight: bold;
  font-size: 16px;
  margin-bottom: 4px;
  line-height: 1.2;
}

.stok {
  font-size: 13px;
  color: #666;
  margin-bottom: 6px;
}

.harga {
  color: #d10000;
  font-weight: bold;
  font-size: 15px;
  line-height: 1.2;
}

.harga-asli {
  text-decoration: line-through;
  color: grey;
  font-size: 13px;
  margin-left: 6px;
}

.tidak-tersedia {
  color: red;
  font-size: 13px;
  margin-top: 4px;
}

  </style>
</head>
