<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TOKO NR REAL</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f0f3;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 10px;
    }

    .banner {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 8px 8px 15px #d1d9e6,
                  -8px -8px 15px #ffffff;
      margin-bottom: 20px;
    }

    .banner img {
      width: 100%;
      display: block;
    }

    .search-container {
      margin: 10px 0 20px;
      display: flex;
      justify-content: center;
    }

    .search-container input {
      width: 100%;
      max-width: 500px;
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      font-size: 16px;
      box-shadow: inset 3px 3px 6px #d1d9e6,
                  inset -3px -3px 6px #ffffff;
      background: #f0f0f3;
      outline: none;
    }

    .marquee-container {
      background: #f0f0f3;
      box-shadow: inset 4px 4px 8px #d1d9e6,
                  inset -4px -4px 8px #ffffff;
      border-radius: 15px;
      padding: 10px 20px;
      margin: 20px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .marquee-container img {
      width: 24px;
      height: 24px;
    }

    .marquee-text {
      flex: 1;
      overflow: hidden;
    }

    .marquee-text marquee {
      font-size: 16px;
      color: #333;
    }

    h2 {
      text-align: left;
      color: #5e2b97;
      margin-bottom: 15px;
    }
    p {
  text-align: left;
  color: #5e2b97;
  margin-bottom: 15px;
}

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .card {
      background: #f0f0f3;
      border-radius: 15px;
      padding: 10px;
      box-shadow: 8px 8px 12px #d1d9e6,
                  -8px -8px 12px #ffffff;
      text-align: right;
      position: relative;
      transition: transform 0.2s ease;
      text-decoration: none;
      color: inherit;
      height: 260px;
    }
card .product-info {
  text-align: left;
}
    .card:hover {
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .label {
      background-color: red;
      color: white;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 12px;
      position: absolute;
      top: 10px;
      left: 10px;
    }

    .card h2 {
      font-size: 14px;
      margin: 6px 0 4px;
      color: #333;
    }

    .card p {
      color: #555;
      font-weight: bold;
      margin: 0 0 8px;
      font-size: 14px;
    }

    .cart-btn {
      background-color: #f0f0f3;
      border: none;
      box-shadow: 3px 3px 6px #d1d9e6,
                  -3px -3px 6px #ffffff;
      border-radius: 50%;
      padding: 10px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">

  </div>

  <!-- SCRIPT PENCARIAN -->
  <script>
    function filterProduk() {
      var input = document.getElementById("searchInput");
      var filter = input.value.toLowerCase();
      var grid = document.getElementById("produkList");
      var cards = grid.getElementsByClassName("card");

      for (var i = 0; i < cards.length; i++) {
        var title = cards[i].getElementsByTagName("h2")[0];
        if (title.innerText.toLowerCase().indexOf(filter) > -1) {
          cards[i].style.display = "";
        } else {
          cards[i].style.display = "none";
        }
      }
    }
  </script>
</body>
