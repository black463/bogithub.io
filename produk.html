<!DOCTYPE html>

      display: flex;

      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 10px;
      margin-bottom: 15px;
      align-items: center;
      text-decoration: none;
      color: inherit;

    }
    .produk img {

      height: 100px;

      border-radius: 6px;
      margin-right: 15px;
    }
    .info {
      flex: 1;
    }

      font-size: 16px;

    }
    .stok { font-size: 13px; color: #666; margin-bottom: 5px; }
    .harga { color: #d10000; font-weight: bold; }
    .harga-asli {
      text-decoration: line-through;
      color: grey;
      font-size: 13px;
    }
    .tidak-tersedia {
      color: red;
      font-size: 13px;
    }
  </style>
</head>
