  <script>
    var kategoriAktif = kategori1;
    var idInput = document.getElementById("id");
    var productList = document.getElementById("productList");

    function rubah(harga) {
      var reverse = harga.toString().split('').reverse().join(''),
        ribuan = reverse.match(/\d{1,3}/g);
      ribuan = ribuan.join('.').split('').reverse().join('');
      return "Rp " + ribuan;
    };

    function showProductDetails(productName, productDescription, productPrice, productUrl) {
      var id = encodeURIComponent(idInput.value);
      if (!id) {
        $('#emptyInputToast').toast('show');
        return;
      }
      var finalUrl = productUrl + (productUrl.includes('?') ? '&' : '?') + 'catatan=' + id;
      window.location.href = finalUrl;
    }


    function loadAllProducts(tabId, kategoriKode) {
      var loadingSpinner = document.getElementById("loadingSpinner");

      function showLoading() {
        loadingSpinner.style.display = "block";
      }

      function hideLoading() {
        loadingSpinner.style.display = "none";
      }

      function compareByPrice(a, b) {
        return a.harga_produk - b.harga_produk;
      }

      var xmlHttpRequest = new XMLHttpRequest();
      showLoading();
      xmlHttpRequest.open("GET", `https://openapi.bukaolshop.net/v1/app/produk?token=${token}&total_data=100&id_kategori=${kategoriKode}`, true);
      xmlHttpRequest.onreadystatechange = function () {
        if (this.readyState == 4 && this.status == 200) {
          var response = JSON.parse(this.responseText);
          if (response && response.data && response.data.length > 0) {
            var filteredProducts = response.data.filter(function (product) {
              return product.id_kategori === kategoriKode;
            });
            filteredProducts.sort(compareByPrice);
            displayProducts(tabId, filteredProducts);
          }
          hideLoading();
        }
      };
      xmlHttpRequest.send();
    }

    function displayProducts(tabId, products) {
      var productList = document.getElementById("productList" + tabId.charAt(tabId.length - 1));
      productList.innerHTML = "";
      products.forEach(function (product) {
        var listItem = document.createElement("li");
        var hargaFormatted = rubah(product.harga_produk);
        var productUrl = `${product.url_produk}`;
        var deskripsi = encodeURIComponent(`${product.deskripsi_panjang}`);
        listItem.setAttribute("data-product-name", product.nama_produk);
        listItem.setAttribute("data-product-price", hargaFormatted);
        listItem.setAttribute("data-product-img", product.url_gambar_produk);
        listItem.setAttribute("data-product-diskon", product.harga_produk_asli);
        listItem.setAttribute("data-product-url", product.url_produk);
        listItem.innerHTML = `<div class="produks animate__animated animate__flipInX" onclick="showProductDetails('${product.nama_produk}', '${deskripsi}', ${product.harga_produk},'${productUrl}')">
                    <div class="pil-produk">
                        <div class="w-100">
                          <div class="d-flex align-items-center">
                            <h4 class="w-100 nama--produks">${product.nama_produk}</h4>
                            <h4 class="harga-asli">${rubah(product.harga_produk_asli)}</h4>
                            <img src="${product.url_gambar_produk}">
                            </div>
                            <p>${hargaFormatted}</p>
                           
                        </div>
                    </div>
                </div>`;
        productList.appendChild(listItem);
        if (product.harga_produk_asli === 0) {
          listItem.querySelector('.harga-asli').classList.add('hidden');
        }
      });
    }
    $(document).ready(function () {
      loadAllProducts("kategori1", kategori1);
    });
  </script>

      }

      $.ajax({
        method: "GET",
        url: "https://api-otomatis.my.id/trueid/bank/?norek=" + id + "&kode=bsm&key=" + api,
        beforeSend: function () {
          $('#nick').text('Sedang Mengecek...');
          $('#nickplayer').text('Sedang Mengecek...');
        },
        success: function (response) {
          if (response.hasOwnProperty('error_msg')) {

  <script>
    function toggleMood() {
      var productList1 = document.getElementById("productList1");
      var iconMood1 = document.getElementById("iconMood1");
      var iconMood2 = document.getElementById("iconMood2");
      if (productList1.classList.contains("mood1")) {
        productList1.classList.remove("mood1");
        productList1.classList.add("mood2");
      } else {
        productList1.classList.remove("mood2");
        productList1.classList.add("mood1");
      }
      if (iconMood1.style.display === "none") {
        iconMood1.style.display = "inline-block";
        iconMood2.style.display = "none";
      } else {
        iconMood1.style.display = "none";
        iconMood2.style.display = "inline-block";
      }
      var currentMood = productList1.classList.contains("mood1") ? "mood1" : "mood2";
      localStorage.setItem("currentMood", currentMood);
    }
    document.getElementById("toggleMoodButton").addEventListener("click", toggleMood);
    document.addEventListener("DOMContentLoaded", function () {
      var savedMood = localStorage.getItem("currentMood");
      if (savedMood === "mood1") {
        toggleMood();
      }
    });
  </script>
